<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Acessibilidade e Otimização | Fatec Taquaritinga 1º Semestre 2025</title>
    <meta name="description" content="Projeto exemplo para uso nas disciplinas de Acessibilidade e Otimização para Buscas na Fatec Taquaritinga no 1º semestre de 2025.">
    <meta name="robots" content="noodp, noydir">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav aria-label="Menu principal">
            <!-- Adicione links de navegação aqui -->
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article>
            <!-- Conteúdo principal do artigo -->
        </article>

        <figure class="boxlogo">
            <img src="./imagens/logo.svg" alt="Logotipo da empresa" />
        </figure>

        <section class="boxlogin" aria-label="Formulário de login">
            <p>Não tem uma conta? <a href="#"><strong>Criar conta</strong></a></p>

            <form action="#" method="post">
                <fieldset>
                    <legend>Acessar conta</legend>

                    <label for="email">E-mail:</label>
                    <input id="email" name="email" type="email" placeholder="Digite seu e-mail" required>

                    <label for="senha">Senha:</label>
                    <input id="senha" name="senha" type="password" placeholder="Digite sua senha" required>

                    <button type="submit">Acessar conta</button>
                </fieldset>
            </form>
        </section>
    </main>

    <aside aria-label="Informações adicionais">
        <!-- Conteúdo complementar (notícias, links, anúncios, etc.) -->
    </aside>

    <footer>
        <p>&copy; 2025 Fatec Taquaritinga. Todos os direitos reservados.</p>
    </footer>

    <script src="index.js"></script>
</body>

</html>
