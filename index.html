<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Projeto Acessibilidade e Otimização | Fatec Taquaritinga 1s 2025</title>
    <meta name="description" content="Projeto exemplo para as disciplinas de Acessibilidade e Otimização para Buscas na Fatec Taquaritinga - 1º semestre de 2025">
    <meta name="robots" content="noindex, nofollow">

    <!-- Pré-conexão e fonte externa -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- CSS Principal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="boxlogo">
            <img src="./imagens/logo.svg" alt="Logo da empresa XYZ">
        </div>
    </header>

    <main>
        <section class="login-section" aria-labelledby="login-title">
            <h1 id="login-title" class="heading">Acessar sua conta</h1>

            <p class="text-medium">
                Já tem uma conta? <a href="#" class="text-medium">Acesse aqui</a>
            </p>
            <p class="text-medium">
                Não tem uma conta? <a href="#" class="text-medium">Criar Conta</a>
            </p>

            <form action="#" method="post" aria-describedby="form-desc">
                <p id="form-desc" class="text-small">Preencha seus dados para acessar sua conta.</p>

                <div class="form-group">
                    <label for="email" class="label-medium">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="form-group">
                    <label for="password" class="label-medium">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="text-large">Acessar conta</button>
            </form>
        </section>
    </main>

    <footer>
        <p class="text-xsmall">© 2025 Fatec Taquaritinga - Projeto Educacional</p>
    </footer>

    <script src="index.js"></script>
</body>
</html>
